# The hosted Panko on one server: Caddy (HTTPS from Let's Encrypt) in front of the front door, which starts each
# user's own Panko inside the same container. Settings in deploy/.env (copy deploy/env.example). See deploy/README.md.
#   docker compose -f deploy/compose.yml up -d --build
services:
  panko:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PANKO_HOST_DATA: /srv/panko
      PANKO_TRUSTED_PROXY: "*"        # only Caddy can reach it: the port isn't published
    volumes:
      - /srv/panko:/srv/panko
    expose:
      - "8800"
    stop_grace_period: 30s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - panko
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
