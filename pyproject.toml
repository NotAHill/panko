[project]
name = "panko"
version = "0.1.0"
description = "Turns language-learning sources into verified Anki cards (Arabic: Fusha, Quranic, Darija)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.12.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
images = ["pillow>=11"]
migrate = [
    "anki==26.9.4",
]
mcp = [
    "mcp>=1.20",
    "jsonschema>=4",
]

[project.scripts]
panko = "panko.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "pre-commit>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panko"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
