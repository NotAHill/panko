[project]
name = "pankohub"            # on PyPI ("panko" there is another project); the command and the module are `panko`
version = "0.1.0"
description = "Turns language-learning material (textbooks, teacher sheets, transcripts) into checked Anki cards with pictures, examples and audio."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["anki", "flashcards", "language-learning", "arabic", "darija", "mcp", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Natural Language :: Arabic",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]
dependencies = [
    "anthropic>=2.12.0",
    "httpx>=0.27",
    "pillow>=11",          # photos and drawings → JPEG, contact sheets
    "python-dotenv>=1.0",
    # the hub (`panko hub`) and chat mode (`panko mcp`): part of every install, so `uv tool install` gives a
    # working Panko on your own computer (docs/ROADMAP.md, track D)
    "starlette>=0.40",
    "uvicorn>=0.30",
    "python-multipart>=0.0.18",
    "mcp>=1.20",
    "jsonschema>=4",
]

[project.optional-dependencies]
images = []   # kept so older install commands still work; Pillow is a core dependency now
migrate = [
    "anki==26.9.4",
]
apkg = [                 # `panko export` and the hub's "share as a file": Anki's own library builds the package
    "anki==26.9.4",
]
hub = []      # kept so older install commands still work: the hub is a core dependency now
host = [                 # the front door of a hosted Panko (src/panko/host, docs/SPEC-hosted.md)
    "argon2-cffi>=23.1",
]
mcp = []      # kept so older install commands still work: chat mode is a core dependency now

[project.urls]
Homepage = "https://github.com/NotAHill/panko"
Source = "https://github.com/NotAHill/panko"

[project.scripts]
panko = "panko.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "pre-commit>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panko"]

[tool.hatch.build.targets.sdist]       # the code and its tests: not the repo's config, deploy files or docs
include = ["/src/panko", "/tests", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
