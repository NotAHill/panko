[project]
name = "panko"
version = "0.1.0"
description = "Turns language-learning material (textbooks, teacher sheets, transcripts) into checked Anki cards with pictures, examples and audio."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["anki", "flashcards", "language-learning", "arabic", "darija", "mcp", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Natural Language :: Arabic",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]
dependencies = [
    "anthropic>=2.12.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
images = ["pillow>=11"]   # contact sheets for `panko pictures search`
migrate = [
    "anki==26.9.4",
]
mcp = [
    "mcp>=1.20",
    "jsonschema>=4",
]

[project.scripts]
panko = "panko.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "pre-commit>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panko"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
