# Which provider does each job. Lists are tried in order: the first provider
# that returns a result wins. Swap or reorder names here; no code changes needed.
# Provider names map to classes in src/panko/providers/.

[audio]
# native = real human audio we already have (teacher clip, Peace Corps recording).
chain = ["native", "elevenlabs", "azure"]
# never fall back to a voice that speaks the wrong variety
allow_placeholder = false

[audio.elevenlabs]
model = "eleven_v3"
format = "mp3_44100_128"
# Voices per variety, in order. The headword and every example are read by every
# voice listed (one tap plays them in turn). Names map to IDs below.
voices_darija = ["Badr", "Ghalia"]
voices_fusha = ["George"]

[audio.elevenlabs.voice_ids]
Badr = "pNCAEmZFNur1TpjR9TC0"     # Moroccan Darija, man, warm narrator
Ghalia = "ugVysa6SU3kBjf7zmeSV"   # Moroccan Darija, woman, warm narrator
George = "JBFqnCBsd6RMkjVDRZzb"   # built-in; interim for Fusha

[audio.azure]
voice_darija = "ar-MA-MounaNeural"
voice_fusha = "ar-SA-HamedNeural"

[images]
# source = picture cropped from the material the word came from. Free photo sites next (wikidata = the Wikidata
# item's own Commons picture, precise for concrete nouns; pexels/pixabay need free keys), the paid drawing last.
# Also available, off by default: "inaturalist" (animals, plants) and "arasaac" (pictograms for actions;
# CC BY-NC-SA, personal use only, not the hand-made look). Try them for one run with
# `panko pictures search --providers inaturalist,arasaac`.
chain = ["source", "wikidata", "commons", "openverse", "pexels", "pixabay", "generate"]

[images.generate]
provider = "openai"      # openai | recraft | gemini
model = "gpt-image-2"   # low quality looks as good as medium for these and costs ~1/9 (test 2026-11-22)
quality = "low"
# A picture-dictionary drawing that helps you remember the word, not a realistic photo.
style = """Simple hand-drawn picture-dictionary illustration: ink lines with soft watercolour, warm muted colours, \
plain off-white paper background, simple uncluttered composition with only the props the idea needs, \
one clear idea that shows the meaning at a glance, memorable and a little playful. \
Everyday modern Moroccan life where it fits: people in ordinary modest clothes (shirts, trousers, \
sometimes a djellaba); if a woman or girl appears, she wears a hijab that covers her hair; \
don't add people the scene doesn't need; no fez, no decorative pots, lanterns or tagines unless the idea needs them. \
No text, no letters, no numbers, no speech bubbles with words."""

[llm]
# Language model for extraction, checking, examples and picture decisions. First ready provider wins.
chain = ["anthropic", "openai"]
budget_usd = 5            # a run whose estimate is over this stops before spending; override with --budget

[llm.anthropic]
model = "claude-opus-5-5"
effort = "medium"         # low | medium | high | xhigh | max; tasks can ask for more
fallbacks = true          # on a policy decline, the API re-runs the request on a fallback model

[llm.tasks]
# A model per task, when the default isn't worth it. Measured 2026-11-23 (eval on the SSD, panko-scratch/eval3):
# - extract, one dense Peace Corps page: Opus $0.17, Sonnet $0.07, Haiku $0.005. All read it right; only Opus kept
#   the house style (3/7/9, no article on nouns, schwas, plurals).
# - check, 50 raw deck rows vs the earlier evidence-backed verdicts (no evidence given): Opus agreed on 27, Haiku
#   24, Sonnet 15. Haiku passes real errors as ok (6 of 12 known fixes, a calque, a wrong gloss); Sonnet over-edits
#   and some of its corrections are wrong. Per item: Opus $0.0057, Sonnet $0.0022, Haiku $0.0002.
# - examples, pictures-plan: all three usable. Sonnet and Haiku let a few Fusha words into sentences; Sonnet wrote
#   two muddled picture prompts; Haiku's picture plans were as good as Opus's.
# So everything stays on Opus. Haiku is the one option for pictures-plan (saves ~$2 on a big source).
# pictures-plan = "claude-haiku-5-5"

[llm.openai]
model = ""                # set a model (and its price below) to use OpenAI instead

[llm.prices]
# USD per million tokens: [input, output, cache read, cache write]. Batches cost half.
"claude-opus-5-5" = [4.0, 20.0, 0.20, 5.0]
"claude-sonnet-5-5" = [2.0, 10.0, 0.10, 2.5]
"claude-haiku-5-5" = [0.10, 0.50, 0.01, 0.125]

[anki]
backend = "mcp"          # mcp (Anki MCP Server add-on) | pylib (Anki closed; used for migrations)
url = "http://127.0.0.1:3141/"
profile = "User 1"       # the Anki profile migrations open (collection = "/path/to/collection.anki2" to override)

[anki.decks]             # where each variety's cards go
darija = "Panko Sandbox::Darija"
fusha = "Panko Sandbox::Fusha"

[anki.card_map]          # migrations: old note type → Panko card per template (Card 1, Card 2…); others are
                         # detected (Arabic on the front → recognition, otherwise production)
"Basic (and reversed card)++" = ["recognition", "production"]
"Basic (and reversed card)+++" = ["recognition", "production"]
"Darija Vocab" = ["recognition", "production"]
"Basic++" = ["recognition"]
"Basic-64524" = ["production"]   # front {{English}}

# ---- The learner: what the prompts assume. Another learner changes these, not the prompts. ----
[learner]
language = "Moroccan Darija"                # what the cards mainly teach
varieties = ["darija", "fusha"]             # store varieties; "fusha" = Modern Standard / Quranic Arabic
learner = "an English-speaking learner"
gloss_language = "English"
mainstream = "Casablanca/Rabat"             # the standard treated as the "usual" word
regions = ["pan-Moroccan", "north (Tangier, Tetouan, Jbala, Chefchaouen)", "Fes-Meknes", "Rabat-Casablanca",
           "Marrakech", "east (Oujda, Berkane)", "south (Souss, Agadir)", "Saharan/Hassaniya", "rural/aroubi"]
topics = ["home", "furniture", "shopping", "food", "cooking", "emotions", "people", "family", "time", "position",
          "greetings", "numbers", "money", "places", "body", "character", "verbs-daily", "grammar", "animals",
          "nature", "work", "school", "health", "religion", "travel", "clothes", "weather", "colors"]
keep = "Religious formulas Moroccans say every day (بسم الله, الله يسامح, أعوذ بالله…) are kept as phrases."
drop = "Drop religious proselytising lines (some shared decks are partly missionary material)."

[learner.translit]
main = "the teacher's Arabizi"
main_rules = "3/7/9 for ع/ح/ق, kh, gh, ch, `e` for schwa, doubled consonants (mherres, chno, wach, n9der, nkhelles, l-bit)"
alt = "scholarly transliteration (ʿ ḥ q x ġ š ž ə ā ī ū ṭ ṣ ḍ ẓ)"
none_for = ["fusha"]   # these varieties' cards show only the Arabic script (your call, 2026-11-23)

[learner.pictures]
# Rules for choosing photos and writing drawing prompts (the drawing house style is [images.generate] style).
rules = [
  "Any woman or girl shown wears a hijab that covers her hair; a photo with a woman whose hair is visible is not used (a photo of the object alone is easiest).",
  "Add a woman to a drawing only when the scene needs one; never describe a woman's hair.",
  "Avoid scenes that clash with modest dress (swimwear) and anything political, violent, gory or religiously disrespectful.",
  "Everyday modern Moroccan life where it fits naturally (souk, tea, taxi, riad, djellaba, couscous on Friday), without overdoing it: no fezzes.",
]
skip = "grammar/function words (prepositions, conjunctions, particles) a picture can't show without text, numbers above 10, and anything sensitive or violent"

# ---- Evidence the checking prompts are given (looked up by Panko before each request) ----
[evidence]
web_search = true                            # let the model search the web for words local evidence doesn't settle
web_searches_per_item = 2

[[evidence.corpora]]                        # open datasets, looked up by word (downloaded automatically)
name = "Darija Open Dataset (DODa)"
path = "cache/refs/doda"
url = "https://github.com/darija-open-dataset/dataset"   # `panko refs` downloads it
include = ["semantic categories/", "syntactic categories/", "sentences/", "x-tra/"]
notes = "word lists (nouns, verbs, adjectives, synonyms…) and a sentence corpus, mostly mainstream (Casablanca/Rabat) Darija; word lists sometimes list regional synonyms side by side"

[[evidence.corpora]]
name = "Wiktionary, Moroccan Arabic entries"
path = "cache/refs/wiktionary-moroccan.jsonl"
url = "https://kaikki.org/dictionary/Moroccan%20Arabic/kaikki.org-dictionary-MoroccanArabic.jsonl"
notes = "sense tags like Northern or Jebli mark regional words"

[[evidence.dictionaries]]                   # private reference texts: a path on your machine, never shipped
name = "The Routledge Introductory Course in Moroccan Arabic"
path = "cache/refs/routledge-moroccan-arabic.txt"
notes = "Rabat/Fes standard; ɛ=ع, ħ=ح, x=خ, ġ/ɣ=غ, š=ش. Present here means mainstream."
