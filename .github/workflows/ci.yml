name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run pytest -q
  install:
    # what a new person gets from `uv tool install pankohub`, on each system (Windows isn't tried anywhere else)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build --wheel
      - name: Install it as a tool
        shell: bash
        run: |
          uv tool install dist/*.whl
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
      - name: The hub, chat mode and the extension work
        run: uv run --no-project --python 3.12 python .github/scripts/smoke_install.py
