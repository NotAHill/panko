<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panko hub</title>
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<link rel="stylesheet" href="/static/app.css">
<script>
  try { const t = localStorage.getItem('panko-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div class="grain" aria-hidden="true"></div>
<div id="app">
  <header class="top">
    <a href="#/" class="brand" aria-label="Panko hub, overview"><img class="mark" src="/static/logo.svg" alt="" width="28" height="28"><span class="word">panko</span></a>
    <button class="search" id="cmd-btn" title="Commands and search (/ or ⌘K)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><span class="grow">Search cards or run a command…</span><kbd>/</kbd></button>
    <span class="grow"></span>
    <span class="top-meta" id="top-meta"></span>
    <button class="icon" id="theme-btn" title="Light or dark (t)" aria-label="Light or dark"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  </header>
  <nav class="side" id="nav"></nav>
  <main id="view" tabindex="-1"></main>
  <footer class="status" id="status"></footer>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="layer"></div>
<script src="/static/app.js"></script>
</body>
</html>
