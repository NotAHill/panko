<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Panko</title>
  <defs>
    <radialGradient id="tile" cx="0.3" cy="0.2" r="1">
      <stop offset="0" stop-color="#2f8a72"/>
      <stop offset="0.6" stop-color="#17604f"/>
      <stop offset="1" stop-color="#114b3e"/>
    </radialGradient>
    <linearGradient id="crust" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#c9772c"/>
      <stop offset="1" stop-color="#8f4a17"/>
    </linearGradient>
    <linearGradient id="crumb" x1="0.8" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#f6d58f"/>
      <stop offset="1" stop-color="#fff6e2"/>
    </linearGradient>
    <linearGradient id="flake" x1="0.8" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#e6a650"/>
      <stop offset="1" stop-color="#fbe3ad"/>
    </linearGradient>
    <path id="slice" d="M -185 240 Q -205 240 -205 220 L -205 -40 C -265 -60 -282 -140 -246 -195 C -200 -266 -100 -276 0 -262 C 25.0 -265.5 50.0 -267.5 74.2 -267.4 L 96.0 -196.0 L 146.0 -222.0 L 152.0 -148.0 L 206.0 -162.0 L 196.0 -100.0 L 241.8 -64.9 C 232.3 -53.8 220.0 -45.0 205.0 -40.0 L 205 220 Q 205 240 185 240 Z"/>
    <path id="chunk" d="M 74.2 -267.4 C 146.6 -267.2 211.5 -248.2 246.0 -195.0 C 273.0 -153.8 270.2 -98.4 241.8 -64.9 L 196.0 -100.0 L 206.0 -162.0 L 152.0 -148.0 L 146.0 -222.0 L 96.0 -196.0 L 74.2 -267.4 Z"/>
    <path id="tear" d="M 74.2 -267.4 L 96.0 -196.0 L 146.0 -222.0 L 152.0 -148.0 L 206.0 -162.0 L 196.0 -100.0 L 241.8 -64.9"/>
    <clipPath id="sliceClip"><use href="#slice"/></clipPath>
    <clipPath id="chunkClip"><use href="#chunk"/></clipPath>
  </defs>

  <!-- tile; the faint rim keeps its edge on dark backgrounds -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#tile)"/>
  <rect x="6" y="6" width="1012" height="1012" rx="224" fill="none" stroke="#fff" stroke-opacity="0.16" stroke-width="12"/>

  <!-- small crumbs -->
  <g fill="url(#flake)" stroke="#fff" stroke-width="60" stroke-linejoin="round" paint-order="stroke">
    <path d="M 910.6 468.6 Q 912.5 487.1 896.5 493.8 Q 880.5 500.5 861.9 505.2 Q 843.2 510.0 840.0 490.8 Q 836.8 471.7 839.2 453.5 Q 841.5 435.3 859.3 438.4 Q 877.1 441.4 892.9 445.7 Q 908.7 450.0 910.6 468.6 Z"/>
    <path d="M 922.1 153.0 Q 918.7 165.0 907.0 160.7 Q 895.3 156.4 885.3 147.4 Q 875.2 138.4 885.7 129.5 Q 896.1 120.5 908.5 118.8 Q 921.0 117.0 923.3 129.0 Q 925.6 141.0 922.1 153.0 Z"/>
  </g>

  <g transform="translate(430 625) rotate(-7) scale(1.22)">
    <!-- the piece that broke off -->
    <g transform="translate(92 -120) rotate(16 170 -170)">
      <use href="#chunk" fill="none" stroke="#fff" stroke-width="49.2" stroke-linejoin="round"/>
      <use href="#chunk" fill="url(#crumb)"/>
      <g clip-path="url(#chunkClip)">
        <use href="#chunk" fill="none" stroke="url(#crust)" stroke-width="64" stroke-linejoin="round"/>
        <use href="#tear" fill="none" stroke="#f8dc9e" stroke-width="68" stroke-linejoin="round" stroke-linecap="round"/>
      </g>
    </g>

    <!-- the slice -->
    <use href="#slice" fill="none" stroke="#fff" stroke-width="49.2" stroke-linejoin="round"/>
    <use href="#slice" fill="url(#crumb)"/>
    <g clip-path="url(#sliceClip)">
      <use href="#slice" fill="none" stroke="url(#crust)" stroke-width="64" stroke-linejoin="round"/>
      <use href="#tear" fill="none" stroke="#f8dc9e" stroke-width="68" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
    <g fill="#e2ad55" fill-opacity="0.6">
      <ellipse cx="-110" cy="-120" rx="26" ry="16" transform="rotate(-20 -110 -120)"/>
      <ellipse cx="-15" cy="-40" rx="30" ry="17" transform="rotate(-10 -15 -40)"/>
      <ellipse cx="75" cy="40" rx="20" ry="13" transform="rotate(15 75 40)"/>
      <ellipse cx="-95" cy="110" rx="24" ry="14" transform="rotate(12 -95 110)"/>
      <ellipse cx="95" cy="165" rx="20" ry="12" transform="rotate(-15 95 165)"/>
      <ellipse cx="-140" cy="-10" rx="14" ry="10" transform="rotate(0 -140 -10)"/>
    </g>
  </g>
</svg>
